[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feishu-bitable-bot"
version = "0.1.0"
description = "Feishu/Lark bot: built-in Requirements Assistant (需求小助手) + multi-role Bitable recording — context, interactive confirm, progress query"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "lark-oapi>=1.4",
  "pydantic>=2.6",
  "openai>=1.30",
  "PyYAML>=6",
  "dateparser>=1.2",
  "structlog>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "time-machine>=2.13", "ruff>=0.5"]

[project.scripts]
bitable-bot = "bitable_bot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bitable_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

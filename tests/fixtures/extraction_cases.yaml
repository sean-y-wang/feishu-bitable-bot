# 提取评测集：原文 → 模型输出(假) → 期望写入字段。CI 用 Fake provider 回归归一化逻辑；
# 真实模型评测可复用 input/expected 手动运行。
- role: /日报
  input: 今天完成了登录模块，明天联调，工时三点五，进度顺利，前端
  llm: {done: 完成了登录模块, plan: 联调, hours: 三点五, status: 顺利, tags: [前端]}
  expected: {今日完成: 完成了登录模块, 明日计划: 联调, 工时: 3.5, 状态: 正常, 标签: [前端]}
- role: /日报
  input: 昨天的日报：接口卡住了，服务端
  llm: {done: 接口开发, date: 昨天, status: 卡住, tags: [服务端]}
  expected: {今日完成: 接口开发, 日期: 1792598400000, 状态: 阻塞, 标签: [后端]}
- role: /bug
  input: 线上故障 支付回调失败 截止 2026-10-30
  llm: {title: 支付回调失败, severity: 线上故障, due: "2026-10-30"}
  expected: {标题: 支付回调失败, 严重程度: P0, 截止日期: 1793289600000}

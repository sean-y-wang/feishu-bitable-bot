# Built-in scenario: 需求小助手 (Requirements Assistant)
# 内置场景：需求小助手 — 专属机器人，仅「记录需求 / 查询进展」两个意图，无需多角色路由。
#
# Deploy:
#   BOT_SCENARIO=requirements
#   # or: BOT_CONFIG=config/roles.requirements.yaml
# Copy to config/roles.yaml and fill real app_token / table_id (local file is gitignored).
# 复制为 config/roles.yaml 并填入真实 app_token / table_id（本地文件已被 gitignore）。
version: 1
scenario: requirements
dedicated: true
bot_name: 需求小助手
react_on_mention: true
react_emoji: Get          # 「收到」表情；失败时静默忽略
query_docs_hint: "若需要查看更多记录，请自行打开需求多维表格检索。"
timezone: Asia/Shanghai
llm:
  default: qwen
  # Cross-provider fallback when default exhausts retries (same-provider: providers.*.fallback_models)
  # 主模型重试耗尽后按序降级；同 provider 换 model 用 fallback_models
  fallback: [deepseek]
  providers:
    openai:   { type: openai_compatible, base_url: https://api.openai.com/v1, api_key: "${OPENAI_API_KEY}", model: gpt-4o-mini, supports_json_schema: true }
    qwen:     { type: openai_compatible, base_url: https://dashscope.aliyuncs.com/compatible-mode/v1, api_key: "${DASHSCOPE_API_KEY}", model: qwen-plus, fallback_models: [qwen-turbo] }
    deepseek: { type: openai_compatible, base_url: https://api.deepseek.com, api_key: "${DEEPSEEK_API_KEY}", model: deepseek-chat }
    private:  { type: openai_compatible, base_url: "http://llm.example.internal:8000/v1", api_key: "${PRIVATE_LLM_KEY}", model: qwen2.5-72b-instruct }
session: { timeout_minutes: 15, max_followups: 2 }  # 含糊收集：话题内一次问齐；超时自动取消
chats_allowlist: []
audit_store_text: true
p2p_enabled: true
ack_after_seconds: 2
first_guide_enabled: true
first_guide_text: "我是需求小助手，只做两件事：① 提需求（自然语言说明，话题里卡片确认后写入）② 查进展（问「我的需求进展 / XX 上线了吗」，卡片返回最相关少量结果）。闲聊问「你可以干什么」我会再引导一次。"

intent:
  enabled: true
  min_confidence: 0.6
  # dedicated 模式下区分 record|query|help，不再选角色

context:
  enabled: true
  recent_messages: 5      # @ 触发时取前文最多 5 条
  include_parent: true
  include_thread: true
  thread_messages: 20
  max_chars: 3000


# ---- Group → Bitable field binding (区分需求方向) ----
# 在飞书群设置 / 开放平台事件里拿到 chat_id（形如 oc_xxx），绑定到字段 key（如 project）。
# chat_id from Feishu group settings / event payload; field_key must match roles[].fields[].key
# chat_field_bindings:
#   - chat_ids: ["oc_xxxxxxxx"]
#     field_key: project
#     value: AIHub
# Or under the role: roles[].chat_bindings (same shape).

# ---- Remote business config (prompts etc. from a Bitable; secrets stay in .env) ----
# 业务提示词等可放配置表；密钥仍走 .env。加载失败则回退本 YAML。
remote_config:
  enabled: false
  app_token: ""          # bascn… of the config base
  table_id: ""           # tbl… key-value table
  refresh_seconds: 300   # reserved; currently applied at startup
  # Table columns (建议列名): config_key | config_value | role_command | enabled
  # Keys: system_prompt / guide_prompt / reply_style / first_guide_text / query_docs_hint /
  #       min_content_chars / bot_name / chat_binding (JSON) / field.<key>.description

roles:
  - command: /提需求
    aliases: [/需求, /req]
    name: 需求小助手
    description: 收集产品需求、功能建议、优化想法；也可查询已有需求进展
    confirm_before_write: true
    queryable: true
    query:
      search_fields: [title]
      reply_fields: [title, status, priority, proposer, due]
      max_candidates: 20
      max_reply: 2          # 咨询仅返回最匹配的两条
      fallback_limit: 30
    min_content_chars: 12
    system_prompt: |
      你是「需求小助手」，帮产品收集需求。优先抽出：标题、背景/描述、所属项目、优先级、期望上线。
      可结合聊天上下文（前文几句）理解并提炼，但不要编造用户没提过的事实。
      用户若在闲聊或只说「记一下」而无实质内容，对应字段填 null 并放入 missing。
    guide_prompt: |
      想提需求的话，请尽量说清这几项（可一条消息写完）：
      1）标题（一句话） 2）背景/要解决什么 3）优先级（P0–P3） 4）期望上线日期
      例：@我 SparkAudio API 要支持流式返回，给开放平台用，P1，期望下月中
    reply_style: 简洁、条目化，少客套
    receipt_title: 已写入需求小助手
    target: { app_token: bascnREQXXXX, table_id: tblREQXXXX }
    fields:
      - { key: title, field: 需求标题, type: text, required: true, max_len: 100, description: 一句话概括需求 }
      - { key: desc, field: 需求描述, type: text, required: false, description: 需求的详细背景和内容（可综合聊天上下文） }
      - key: project
        field: 所属项目
        type: single_select
        default: 其他
        options: [{ value: AIHub, synonyms: [aihub, 货架] }, { value: kongpilot-console, synonyms: [kongpilot] }, { value: 其他 }]
      - key: type
        field: 需求类型
        type: single_select
        default: 新功能
        options: [{ value: 新功能 }, { value: 优化, synonyms: [改进, 体验] }, { value: 缺陷, synonyms: [bug, 问题, 报错] }, { value: 技术债, synonyms: [重构] }]
      - key: priority
        field: 优先级
        type: single_select
        default: P2
        options: [{ value: P0, synonyms: [紧急, 最高] }, { value: P1, synonyms: [高] }, { value: P2, synonyms: [中] }, { value: P3, synonyms: [低] }]
      - { key: due, field: 期望上线日期, type: date, required: false }
      - { key: proposer, field: 提出人, type: text, required: false, default: $sender_name, description: 提出需求的人；没明确提到其他人就留空 }
      - key: status
        field: 状态
        type: single_select
        default: 待评估
        options: [{ value: 待评估 }]
      - { key: source, field: 来源群, type: text, default: $chat_name }
      - { key: raw_text, field: 原始消息, type: text, default: $raw_text }
      - { key: context, field: 上下文摘录, type: text, default: $context }
      - { key: message_link, field: 消息链接, type: url, default: $message_link }
      - { key: submitted_at, field: 提交时间, type: date, default: $now }
